stages: [verify, build, release]

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

variables:
  GLAB_ENABLE_CI_AUTOLOGIN: "true"
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

verify:frontend:
  stage: verify
  image: node:24
  script:
    - npm ci
    - node scripts/check-release.mjs
    - node --test scripts/__tests__/*.node.mjs
    - npm run typecheck
    - npm test
    - npm run build

.linux:
  image: rust:1.98-trixie
  before_script:
    - apt-get update
    - apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdav1d-dev patchelf file curl git python3 meson ninja-build nasm pkg-config build-essential rpm

verify:backend:
  extends: .linux
  stage: verify
  script:
    - rustup component add rustfmt clippy
    - python3 -m unittest discover -s scripts/__tests__ -p 'test_*.py'
    - cd src-tauri
    - cargo fmt -- --check
    - cargo clippy --locked --all-targets -- -D warnings
    - cargo test --locked

build:linux:
  extends: .linux
  stage: build
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    - curl -fsSL https://deb.nodesource.com/setup_24.x | bash -
    - apt-get install -y nodejs
    - npm ci
    - npm run release:build
    - python3 scripts/release-assets.py --platform linux --bundle src-tauri/target/release/bundle
  artifacts:
    paths: [release-assets/]
    expire_in: 30 days

build:windows:
  stage: build
  tags: [windows]
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    - npm ci
    - npm run release:build
    - python scripts/release-assets.py --platform windows --bundle src-tauri/target/release/bundle
  artifacts:
    paths: [release-assets/]
    expire_in: 30 days

build:macos:
  stage: build
  tags: [macos]
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    - rustup target add x86_64-apple-darwin aarch64-apple-darwin
    - npm ci
    - npm run release:build
    - python3 scripts/release-assets.py --platform macos --bundle src-tauri/target/universal-apple-darwin/release/bundle
  artifacts:
    paths: [release-assets/]
    expire_in: 30 days

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  needs: [build:linux, build:windows, build:macos]
  rules:
    - if: '$CI_COMMIT_TAG'
      when: manual
  before_script:
    - apk add --no-cache python3
  script:
    - python3 scripts/release-assets.py --finalize
    - glab release create "$CI_COMMIT_TAG" --no-update --use-package-registry --name "Imglyze $CI_COMMIT_TAG" --notes-file docs/RELEASE_NOTES.md release-assets/*
