stages:
  - lint
  - test
  - build
  - release

variables:
  CARGO_HOME: $CI_PROJECT_DIR/.cargo
  npm_config_cache: $CI_PROJECT_DIR/.npm

# Cache dependencies
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .cargo/
    - .npm/
    - src-tauri/target/
    - node_modules/

# === LINT STAGE ===

lint:frontend:
  stage: lint
  image: node:20
  script:
    - npm ci
    - npm run lint || echo "Add lint script to package.json"
  only:
    - merge_requests
    - main

lint:backend:
  stage: lint
  image: rust:latest
  before_script:
    - apt-get update
    - apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libayatana-appindicator3-dev
  script:
    - cd src-tauri
    - rustup component add clippy
    - cargo clippy -- -D warnings
  only:
    - merge_requests
    - main

format:check:
  stage: lint
  image: rust:latest
  script:
    - cd src-tauri
    - rustup component add rustfmt
    - cargo fmt -- --check
  only:
    - merge_requests
    - main

# === TEST STAGE ===

test:frontend:
  stage: test
  image: node:20
  script:
    - npm ci
    - npm run test || echo "Add tests first!"
  coverage: '/Lines\s*:\s*(\d+\.\d+)%/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
  only:
    - merge_requests
    - main

test:backend:
  stage: test
  image: rust:latest
  before_script:
    - apt-get update
    - apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libayatana-appindicator3-dev
  script:
    - cd src-tauri
    - cargo test --verbose
  only:
    - merge_requests
    - main

# === BUILD STAGE ===

build:linux:
  stage: build
  image: rust:latest
  before_script:
    # Install dependencies for Tauri
    - apt-get update
    - apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libayatana-appindicator3-dev
    - curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
    - apt-get install -y nodejs
  script:
    - npm ci
    - npm run build
    - npm run tauri build
  artifacts:
    paths:
      - src-tauri/target/release/bundle/
    expire_in: 1 week
  only:
    - main
    - tags

build:windows:
  stage: build
  tags:
    - windows # Requires Windows runner
  script:
    - npm ci
    - npm run build
    - npm run tauri build
  artifacts:
    paths:
      - src-tauri/target/release/bundle/
    expire_in: 1 week
  only:
    - main
    - tags
  when: manual # Manual trigger for Windows builds

build:macos:
  stage: build
  tags:
    - macos # Requires macOS runner  
  script:
    - npm ci
    - npm run build
    - npm run tauri build
  artifacts:
    paths:
      - src-tauri/target/release/bundle/
    expire_in: 1 week
  only:
    - main
    - tags
  when: manual # Manual trigger for macOS builds

# === RELEASE STAGE ===

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  script:
    - echo "Creating release for $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    name: 'Release $CI_COMMIT_TAG'
    description: 'Automated release for $CI_COMMIT_TAG'
    assets:
      links:
        - name: 'Linux AppImage'
          url: '$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/browse/src-tauri/target/release/bundle?job=build:linux'
  only:
    - tags
  dependencies:
    - build:linux

# === UTILITY JOBS ===

# Security audit
security:audit:
  stage: test
  image: rust:latest
  script:
    - cargo install cargo-audit
    - cd src-tauri
    - cargo audit
  allow_failure: true
  only:
    - schedules
    - main

# Dependency updates check
dependencies:check:frontend:
  stage: lint
  image: node:20
  script:
    - npm outdated || true
  allow_failure: true
  only:
    - schedules

dependencies:check:backend:
  stage: lint
  image: rust:latest
  before_script:
    - apt-get update
    - apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libayatana-appindicator3-dev
  script:
    - cd src-tauri
    - cargo install cargo-outdated --locked || true
    - cargo outdated
  allow_failure: true
  only:
    - schedules
