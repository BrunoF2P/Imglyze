[package]
name = "imglyze"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "imglyze_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", features = ["avif-native"] }
ravif = { version = "0.13", default-features = false, features = ["threading"] }
fast_image_resize = { version = "6.1.0", features = ["image"] }
image-compare = "0.5.0"
resvg = "0.48.1"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
oxipng = { version = "10.2.1", features = [
    "parallel",
    "zopfli",
], default-features = false }
webp = "0.3.0"
zip = "9.0.2"
walkdir = "2.5.0"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1.8.0", features = ["v4"] }
tauri-plugin-dialog = "2.8.2"
tempfile = "3.27.0"
imagequant = "4.4.1"
png = "0.18.1"
img-parts = "0.4.0"
mozjpeg = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
num_cpus = "1.17"
fs2 = "0.4"
time = "0.3"
tauri-plugin-store = "2.5.0"
scopeguard = "1.2"


[profile.release]
codegen-units = 1 # Allows LLVM to perform better optimization.
lto = true        # Enable Link Time Optimization.
opt-level = 3     # Optimize for speed.
panic = "abort"   # Abort on panic (smaller binary).
