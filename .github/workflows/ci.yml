name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  verify:
    name: Verificar frontend e backend
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: rustfmt, clippy
      - name: Dependências Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdav1d-dev pkg-config
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Versões e scripts de release
        run: |
          node scripts/check-release.mjs
          node --test scripts/__tests__/*.node.mjs
          python3 -m unittest discover -s scripts/__tests__ -p 'test_*.py'
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml

  installers:
    name: Instaladores ${{ matrix.platform }}
    needs: verify
    if: github.ref_type == 'tag'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-24.04
            bundle: src-tauri/target/release/bundle
          - platform: windows
            runner: windows-latest
            bundle: src-tauri/target/release/bundle
          - platform: macos
            runner: macos-latest
            bundle: src-tauri/target/universal-apple-darwin/release/bundle
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      RELEASE_REQUIRE_SIGNING: ${{ vars.RELEASE_REQUIRE_SIGNING || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        if: matrix.platform == 'windows'
      - name: Dependências Linux
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf file nasm pkg-config rpm
      - name: Dependências macOS
        if: matrix.platform == 'macos'
        run: |
          brew install nasm pkg-config
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
      - name: Dependências Windows
        if: matrix.platform == 'windows'
        run: |
          choco install nasm pkgconfiglite --yes --no-progress
          "C:\Program Files\NASM" >> $env:GITHUB_PATH
      - run: python -m pip install meson ninja
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri
          key: release-${{ matrix.platform }}
          cache-on-failure: true
      - name: Importar certificado Windows quando configurado
        if: matrix.platform == 'windows'
        env:
          CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ($env:CERTIFICATE) {
            if (-not $env:CERTIFICATE_PASSWORD) { throw "WINDOWS_CERTIFICATE_PASSWORD ausente" }
            $path = Join-Path $env:RUNNER_TEMP 'imglyze-signing.pfx'
            try {
              [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:CERTIFICATE))
              $password = ConvertTo-SecureString $env:CERTIFICATE_PASSWORD -AsPlainText -Force
              $cert = Import-PfxCertificate -FilePath $path -CertStoreLocation Cert:\CurrentUser\My -Password $password
              "WINDOWS_CERTIFICATE_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV
            } finally { Remove-Item $path -ErrorAction SilentlyContinue }
          }
      - run: npm ci
      - name: Empacotar aplicativo
        env:
          APPLE_CERTIFICATE: ${{ matrix.platform == 'macos' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ matrix.platform == 'macos' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.platform == 'macos' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ matrix.platform == 'macos' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ matrix.platform == 'macos' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.platform == 'macos' && secrets.APPLE_TEAM_ID || '' }}
        run: npm run release:build
      - name: Coletar instaladores
        run: python scripts/release-assets.py --platform ${{ matrix.platform }} --bundle '${{ matrix.bundle }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installers-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Preparar release
    needs: installers
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: installers-*
          merge-multiple: true
          path: release-assets
      - name: Validar os seis instaladores e gerar hashes
        run: python3 scripts/release-assets.py --finalize
      - name: Criar ou atualizar rascunho
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cp docs/RELEASE_NOTES.md release-notes.md
          printf '\nInstaladores: Windows x64, Linux x64 e macOS universal (Intel/Apple Silicon).\nVerifique SHA256SUMS.txt antes da instalação.\n\nA assinatura de publicador e a notarização dependem dos certificados configurados no pipeline. Builds sem certificados podem exibir alertas do sistema.\n' >> release-notes.md
          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json 2>/dev/null; then
            python3 -c 'import json; assert json.load(open("release-state.json"))["isDraft"], "Release já publicada: recuse sobrescrever instaladores"'
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
            gh release edit "$RELEASE_TAG" --notes-file release-notes.md
          else
            gh release create "$RELEASE_TAG" release-assets/* --verify-tag --draft --title "Imglyze $RELEASE_TAG" --notes-file release-notes.md
          fi
